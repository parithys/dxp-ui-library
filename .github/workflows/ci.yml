name: CI

# The library builds and is checked on its own: type-check, lint, tests, the package build, the Storybook build, and the packed tarball
# (uploaded as an artifact, so an application can be tested against this exact build before it is published).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # oxlint: 0 warnings is the standing state, so any warning fails the run.
      - name: Lint
        run: npx oxlint --deny-warnings

      - name: Test
        run: npm test

      # ESM + CJS + type declarations + dist/styles.css and the CSS partials.
      - name: Build the package
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Pack
        id: pack
        run: |
          npm pack --silent
          echo "tarball=$(ls vfq-dxp-ui-*.tgz | head -n 1)" >> "$GITHUB_OUTPUT"

      # The tarball an application installs with `npm run lib:install -- <tarball or URL>`.
      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: dxp-ui-tarball
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

      - name: Upload Storybook
        uses: actions/upload-artifact@v4
        with:
          name: dxp-ui-storybook
          path: storybook-static
          if-no-files-found: error
